<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Bungee&family=Yellowtail&family=Nunito+Sans:wght@400;600;700;800&display=swap" />
  <link rel="stylesheet" href="src/variables.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header>
    <p class="franja">
      <span>Fabricamos y personalizamos máquinas arcade en Colombia</span>
      <span><a href="https://wa.me/573126060313" target="_blank" rel="noopener noreferrer">Cotiza por WhatsApp: 312 606
          0313</a></span>
    </p>
    <nav class="top_navegation">
      <div class="logo">
        <img src="src/files/assets/logo-addict.png" alt="Logo de la empresa Add1ctGames" />
      </div>
      <ul class="menu_navegacion">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="catalogo.html">Catálogo</a></li>
        <li><a href="personalizacion.html">Personalización</a></li>
        <li><a class="pagina_actual" href="galeria.html">Galería</a></li>
        <li><a href="empresas.html">Empresas</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
        <li><a href="carrito.html">Carrito</a></li>
      </ul>
      <div>
        <button class="boton_cotizar">Cotizar</button>
      </div>
    </nav>
  </header>
  <main>
    <section class="seccion">
      <div class="contenedor">
        <div class="seccion__encabezado">
          <div>
            <p class="acento">Trabajos terminados</p>
            <h2>Galería de trabajos</h2>
          </div>
        </div>

        <div class="galeria grilla grilla--4">
          <figure class="galeria__item">
            <div class="galeria-producto__imagen">
              <img src="src/files/fotos maquinas/arcade.tron.jpg"
                alt="Arcade vertical con diseño de Tron, con pantalla y botones iluminados" />
            </div>
          </figure>

          <figure class="galeria__item">
            <div class="galeria-producto__imagen">
              <img src="src/files/fotos maquinas/arcade-corporativa.jpg"
                alt="Arcade vertical personalizada con el logo de Ruta N y gráficos verdes y azules" />
            </div>
          </figure>

          <figure class="galeria__item">
            <div class="galeria-producto__imagen">
              <img src="src/files/fotos maquinas/arcade-mariobros.jpg"
                alt="Arcade vertical con diseño de Super Mario y sus personajes" />
            </div>
          </figure>

          <figure class="galeria__item">
            <div class="galeria-producto__imagen">
              <img src="src/files/fotos maquinas/arcade-nintendo.jpg"
                alt="Arcade vertical con diseño de consola Nintendo y logos de Add1ctGames" />
            </div>
          </figure>

          <figure class="galeria__item">
            <div class="galeria-producto__imagen">
              <img src="src/files/fotos maquinas/arcade-minibar.jpg"
                alt="Arcade con diseño de El Joker y Pac-Man, con nevera iluminada en la parte inferior" />
            </div>
          </figure>

          <figure class="galeria__item">
            <div class="galeria-producto__imagen">
              <img src="src/files/fotos maquinas/arcade-dokeykong.jpg"
                alt="Arcade vertical amarilla con diseño de Donkey Kong" />
            </div>
          </figure>

          <figure class="galeria__item">
            <div class="galeria-producto__imagen">
              <img src="src/files/fotos maquinas/arcade-killerinstintc.jpg"
                alt="Arcade vertical negra con diseño de Killer Instinct" />
            </div>
          </figure>

          <figure class="galeria__item">
            <div class="galeria-producto__imagen">
              <img src="src/files/fotos maquinas/Arcade-pacman.jpg"
                alt="Arcade vertical con diseño de Pac-Man en amarillo y negro" />
            </div>
          </figure>
        </div>
      </div>
    </section>
  </main>
  <div class="visor" id="visor" role="dialog" aria-modal="true" aria-label="Imagen ampliada">
    <button type="button" class="boton boton--primario visor__cerrar" id="cerrar_visor">Cerrar</button>
    <img class="visor__imagen" id="imagen_visor" alt="" />
  </div>

  <script src="src/js/galeria.js"></script>
</body>

</html>
