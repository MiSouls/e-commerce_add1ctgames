<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add1ctGames - Administración</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bungee&family=Yellowtail&family=Nunito+Sans:wght@400;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="src/variables.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <nav class="top_navegation">
        <div class="logo">
          <img
            src="src/files/assets/logo-addict.png"
            alt="Logo de la empresa Add1ctGames"
          />
        </div>
        <div>
          <h1>PANEL ADMINISTRATIVO</h1>
        </div>
        <ul class="menu_navegacion">
          <li><a href="index.html">Volver al sitio</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <div class="actualizacion_banner">
        <h2 class="titulo_actualizacion">Actualizar banner</h2>
        <label for="foto_banner">Elige la imagen del banner</label>
        <input id="foto_banner" type="file" accept="image/*" />
        <button class="boton--primario boton" id="boton_banner" type="button">
          Guardar
        </button>
        <p id="mensaje_banner"></p>
      </div>
            <div class="actualizacion-precio">
        <h2>Actualizar precio</h2>
        <label for="campo-precio">Precio de la Arcade vertical clásica</label>
        <input
          id="campo-precio"
          type="text"
          inputmode="numeric"
          placeholder="Ej: 2500000"
        />
        <button class="boton boton--primario" id="boton-precio" type="button">
          Guardar
        </button>
        <p id="mensaje-precio"></p>
      </div>
    </main>
    <script src="src/js/admin.js"></script>
  </body>
</html>
